<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9995a"/>
      <stop offset="55%" stop-color="#b58a3d"/>
      <stop offset="100%" stop-color="#96702c"/>
    </linearGradient>
  </defs>

  <!-- outer ring -->
  <circle cx="50" cy="50" r="46.5" fill="none" stroke="url(#goldGrad)" stroke-width="2.4"/>
  <circle cx="50" cy="50" r="41.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.6" opacity="0.55"/>

  <!-- small radiant mark above the spine -->
  <g fill="url(#goldGrad)">
    <path d="M50 20.5 L51.6 25 L56 26.6 L51.6 28.2 L50 32.7 L48.4 28.2 L44 26.6 L48.4 25 Z"/>
  </g>

  <!-- open book -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 40 C 50 38 48.5 36.8 46 36.2 C 40.5 34.9 32.5 34.6 27 35.4 C 25.6 35.6 25 36.4 25 37.6 L25 63.8 C25 65 25.7 65.7 27 65.6 C32.5 65.1 40.5 65.4 46 66.9 C48.5 67.6 50 68.7 50 70.4"/>
    <path d="M50 40 C 50 38 51.5 36.8 54 36.2 C 59.5 34.9 67.5 34.6 73 35.4 C 74.4 35.6 75 36.4 75 37.6 L75 63.8 C75 65 74.3 65.7 73 65.6 C67.5 65.1 59.5 65.4 54 66.9 C51.5 67.6 50 68.7 50 70.4"/>
    <line x1="50" y1="40" x2="50" y2="70.4"/>
  </g>

  <!-- text lines on each page -->
  <g stroke="url(#goldGrad)" stroke-width="1.1" stroke-linecap="round" opacity="0.75">
    <line x1="30" y1="44" x2="42.5" y2="42.9"/>
    <line x1="30" y1="49" x2="42.5" y2="48.1"/>
    <line x1="30" y1="54" x2="42.5" y2="53.3"/>
    <line x1="57.5" y1="42.9" x2="70" y2="44"/>
    <line x1="57.5" y1="48.1" x2="70" y2="49"/>
    <line x1="57.5" y1="53.3" x2="70" y2="54"/>
  </g>
</svg>
